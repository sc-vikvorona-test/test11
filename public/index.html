<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Linksaver</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input { flex: 1; padding: .4rem; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: .4rem .8rem; cursor: pointer; }
    #bookmarks li { padding: .4rem 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .tag { background: #e0e7ff; border-radius: 3px; padding: 0 4px; font-size: .8rem; margin-left: 4px; }
  </style>
</head>
<body>
  <h1>🔖 Linksaver</h1>
  <form id="add-form">
    <input id="title" placeholder="Title" required>
    <input id="url" placeholder="URL" required>
    <button type="submit">Add</button>
  </form>
  <ul id="bookmarks"></ul>
  <script src="/app.js"></script>
</body>
</html>
